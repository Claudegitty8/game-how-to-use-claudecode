# Veröffentlicht den Ordner spiel/ auf GitHub Pages.
# Läuft NUR, wenn der Besitzer es von Hand startet (Reiter «Actions», Knopf «Run workflow»).
# Vorher werden alle Prüfungen ausgeführt. Bestehen sie nicht, wird nichts veröffentlicht.
name: Spiel veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run pruefen
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spiel
      - id: pages
        uses: actions/deploy-pages@v4
